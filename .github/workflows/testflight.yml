name: Build and ship to TestFlight

on:
  workflow_dispatch:
    inputs:
      note:
        description: "Optional note for this build (shows in the run title only)"
        required: false
        default: ""
  push:
    branches: [main, master]
    paths:
      - "web/**"
      - "ios/**"
      - "project.yml"
      - "fastlane/**"
      - "Gemfile*"
      - ".github/workflows/testflight.yml"

concurrency:
  group: testflight
  cancel-in-progress: false

permissions:
  contents: write   # match stores encrypted certificates on a branch of this repo

jobs:
  check-web:
    name: Check game content and logic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate question bank
        run: node tools/validate-content.js
      - name: Install Playwright
        run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Play a full game in a headless browser
        run: node tests/game.test.js

  build:
    name: Build, sign and upload
    needs: check-web
    runs-on: macos-26
    timeout-minutes: 60
    env:
      BUNDLE_ID: ${{ vars.BUNDLE_ID || 'com.jonrussell.zing' }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_URL: https://github.com/${{ github.repository }}.git
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_NUMBER: ${{ github.run_number }}
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      FASTLANE_HIDE_CHANGELOG: "1"
      LC_ALL: en_US.UTF-8
      LANG: en_US.UTF-8
    steps:
      - uses: actions/checkout@v4

      - name: Check the five secrets are present
        id: secrets
        run: |
          missing=""
          for v in APPLE_TEAM_ID APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_CONTENT MATCH_PASSWORD; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            msg="Missing GitHub secret(s):$missing. Open the repo on github.com > Settings > Secrets and variables > Actions. SETUP.md explains where each value comes from."
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::error::$msg"; exit 1
            else
              echo "::warning::Skipping the TestFlight build. $msg"
              echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi
          case "$APP_STORE_CONNECT_KEY_CONTENT" in
            *"BEGIN PRIVATE KEY"*) echo "API key looks right." ;;
            *) echo "::error::APP_STORE_CONNECT_KEY_CONTENT must be the full text of the .p8 file, starting with -----BEGIN PRIVATE KEY-----"; exit 1 ;;
          esac
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Select Xcode
        if: steps.secrets.outputs.ready == 'true'
        run: |
          # Apple requires the iOS 26 SDK or newer, so pick the newest Xcode 26 on the runner.
          XCODE="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$XCODE" ]; then XCODE="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"; fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        if: steps.secrets.outputs.ready == 'true'
        run: brew install xcodegen

      - name: Generate Xcode project
        if: steps.secrets.outputs.ready == 'true'
        run: |
          xcodegen generate
          ls -la

      - uses: ruby/setup-ruby@v1
        if: steps.secrets.outputs.ready == 'true'
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build and upload to TestFlight
        if: steps.secrets.outputs.ready == 'true'
        run: bundle exec fastlane ios beta

      - name: Keep the .ipa as a downloadable artifact
        if: always() && steps.secrets.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Zing-build-${{ github.run_number }}
          path: build/*.ipa
          if-no-files-found: ignore
