<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: "Fredoka"; src: url("../web/fonts/Fredoka-Variable.ttf"); font-weight: 300 700; }
html,body{margin:0;width:1024px;height:1024px;overflow:hidden;background:#120d2b}
.icon{position:relative;width:1024px;height:1024px;background:radial-gradient(120% 90% at 50% 0%, #3a1f7a 0%, #1a0f3f 55%, #0b0720 100%);overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.75;mix-blend-mode:screen}
.b1{width:620px;height:620px;background:#ff5e7e;left:-180px;top:-120px}
.b2{width:560px;height:560px;background:#ffb443;right:-160px;top:40px;opacity:.6}
.b3{width:620px;height:620px;background:#2ed3b7;left:60px;bottom:-260px;opacity:.6}
.b4{width:520px;height:520px;background:#7c5cff;right:-120px;bottom:-140px}
.card{position:absolute;left:112px;top:112px;width:800px;height:800px;border-radius:190px;background:#fff6e5;box-shadow:0 40px 90px rgba(0,0,0,.45), inset 0 -14px 0 rgba(0,0,0,.08)}
.z{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:Fredoka;font-weight:700;font-size:640px;line-height:1;letter-spacing:-.04em;color:#1e1b3a;transform:translateY(-14px)}
.z span{background:linear-gradient(135deg,#ffb443 0%,#ff5e7e 50%,#7c5cff 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.bolt{position:absolute;left:660px;top:150px;font-size:200px;transform:rotate(14deg);filter:drop-shadow(0 12px 18px rgba(0,0,0,.25))}
</style></head><body>
<div class="icon">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div>
  <div class="card"><div class="z"><span>Z</span></div></div>
  <div class="bolt">⚡</div>
</div>
</body></html>
